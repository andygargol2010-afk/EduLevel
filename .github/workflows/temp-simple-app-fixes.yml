name: Move home-only CTA and social proof

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: !contains(github.event.head_commit.message, '[home-only-sections-fixed]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move CTA and social proof inside Inicio
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('EduLevel-fix-tailwind/src/App.tsx')
          text = path.read_text(encoding='utf-8')

          start_marker = '      <section className="max-w-[1440px] mx-auto px-4 lg:px-8 pt-8 pb-4">'
          end_marker = '      </section>\n\n      <SiteFooter onTab={setTab} />'
          insertion_marker = '          </section>\n        </main>\n      )}\n\n      {activeTab === "simulacros" && ('

          if text.count(start_marker) != 1:
              raise SystemExit(f'Expected CTA start marker exactly once, found {text.count(start_marker)}')
          if text.count(end_marker) != 1:
              raise SystemExit(f'Expected CTA/social proof end marker exactly once, found {text.count(end_marker)}')
          if text.count(insertion_marker) != 1:
              raise SystemExit(f'Expected Inicio insertion point exactly once, found {text.count(insertion_marker)}')

          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker) - len('      <SiteFooter onTab={setTab} />')
          block = text[start:end]

          # Remove CTA + social proof from the global position before the footer.
          text = text[:start] + text[end:]

          if text.count(insertion_marker) != 1:
              raise SystemExit('Insertion point changed unexpectedly after removal')

          replacement = '          </section>\n\n' + block + '\n        </main>\n      )}\n\n      {activeTab === "simulacros" && ('
          text = text.replace(insertion_marker, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify TypeScript build
        working-directory: EduLevel-fix-tailwind
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temp-simple-app-fixes.yml
          git add EduLevel-fix-tailwind/src/App.tsx .github/workflows/temp-simple-app-fixes.yml
          git commit -m "fix: keep CTA and social proof on Inicio [home-only-sections-fixed]"
          git push
